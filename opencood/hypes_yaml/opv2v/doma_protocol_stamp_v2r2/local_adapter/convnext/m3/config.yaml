name: STAMP_DOMA_V2R2_adapter_m3_second32
seed: 303
root_dir: "dataset/OPV2V/train"
validate_dir: "dataset/OPV2V/validate"
test_dir: "dataset/OPV2V/test"

yaml_parsers:   
  m0: "load_general_params"
  m3: "load_general_params"
  
train_params:
  batch_size: &batch_size 2
  epoches: 5
  eval_freq: 1
  save_freq: 1
  max_cav: 5

comm_range: 70
input_source: ['lidar', 'camera', 'depth']
label_type: 'lidar'
cav_lidar_range: &cav_lidar [-102.4, -102.4, -3, 102.4, 102.4, 1] 

add_data_extension: ['bev_visibility.png']

heter:
  assignment_path: "opencood/modality_assign/opv2v_4modality_in_order.json"
  ego_modality: &ego_modality "m3"
  lidar_channels_dict:
    m3: 32
  protocol_modality: &protocol_modality "m0"
  mapping_dict:
    m1: m3
    m2: m3
    m3: m3
    m4: m3
  modality_setting:
    m0:
      sensor_type: &sensor_type_m0 'lidar'
      core_method: &core_method_m0 "point_pillar"

      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m0 [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: &cav_lidar_m0 [-102.4, -102.4, -3, 102.4, 102.4, 1]

      postprocess:
        core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
        gt_range: *cav_lidar_m0
        voxel_size: *voxel_size_m0
        anchor_args:
          cav_lidar_range: *cav_lidar_m0
          l: 3.9
          w: 1.6
          h: 1.56
          r: &anchor_yaw_m0 [0, 90]
          feature_stride: 2
          num: &anchor_num_m0 2
        target_args:
          pos_threshold: 0.6
          neg_threshold: 0.45
          score_threshold: 0.2
        order: 'hwl' # hwl or lwh
        max_num: 150 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
        nms_thresh: 0.15
        dir_args: &dir_args_m0
          dir_offset: 0.7853
          num_bins: 2
          anchor_yaw: *anchor_yaw_m0
    m3:
      sensor_type: &sensor_type_m3 'lidar'
      core_method: &core_method_m3 "second"

      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m3 [0.1, 0.1, 0.1]
          max_points_per_voxel: 5
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: &cav_lidar_m3 [-102.4, -102.4, -3, 102.4, 102.4, 1]

      postprocess:
        core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
        gt_range: *cav_lidar_m3
        voxel_size: [0.4, 0.4, 4]
        anchor_args:
          cav_lidar_range: *cav_lidar_m3
          l: 3.9
          w: 1.6
          h: 1.56
          r: &anchor_yaw_m3 [0, 90]
          feature_stride: 2
          num: &anchor_num_m3 2
        target_args:
          pos_threshold: 0.6
          neg_threshold: 0.45
          score_threshold: 0.2
        order: 'hwl' # hwl or lwh
        max_num: 150 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
        nms_thresh: 0.15
        dir_args: &dir_args_m3
          dir_offset: 0.7853
          num_bins: 2
          anchor_yaw: *anchor_yaw_m3


fusion:
  core_method: 'intermediateheteradapter'
  dataset: 'opv2v'
  args: 
    proj_first: false
    grid_conf: None # place-holder
    data_aug_conf: None # place-holder

# model related
model:
  core_method: collab_w_adapter
  args:
    stage: train_adapter_w_output
    crop_to_visible: true
    supervise_single: true
    ego_modality: *ego_modality
    protocol_modality: *protocol_modality
    heterogeneous: true

    m0:
      core_method: *core_method_m0
      sensor_type: *sensor_type_m0
      lidar_range: *cav_lidar_m0

      encoder_args:
        voxel_size: *voxel_size_m0
        lidar_range: *cav_lidar_m0
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64

      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
  
      aligner_args:
        core_method: identity

      fusion_method: pyramid

      fusion_backbone: 
        resnext: true
        layer_nums: [3, 5, 8]
        layer_strides: [1, 2, 2]
        num_filters: [64, 128, 256]
        upsample_strides: [1, 2, 4]
        num_upsample_filter: [128, 128, 128]
        anchor_number: *anchor_num_m0

      shrink_header: 
        kernal_size: [ 3 ]
        stride: [ 1 ]
        padding: [ 1 ]
        dim: [ 256 ]
        input_dim: 384 # 128 * 3

      in_head: 256
      anchor_number: *anchor_num_m0
      dir_args: *dir_args_m0
        
    m3:
      core_method: *core_method_m3
      sensor_type: *sensor_type_m3
      lidar_range: *cav_lidar_m3

      encoder_args:
        voxel_size: *voxel_size_m3
        lidar_range: *cav_lidar_m3
        mean_vfe:
          num_point_features: 4
        spconv:
          num_features_in: 64
          num_features_out: 64
        map2bev:
          feature_num: 128

      backbone_args:
        layer_nums: [3]
        layer_strides: [1] # Note here for Second, this is set to be 1 not 2.
        num_filters: [64]
        inplanes: 128
  
      aligner_args:
        core_method: identity

      adapter:
        core_method: adapterconvnext
        args:
          in_channels: 64
          out_channels: 64
          in_cav_lidar_range: *cav_lidar_m3
          out_cav_lidar_range: *cav_lidar_m3
          in_feature_shape: [256, 256]
          out_feature_shape: [256, 256]
          submodule_args:
            num_of_blocks: 3
            dim: 64

      reverter:
        core_method: adapterconvnext
        args:
          in_channels: 64
          out_channels: 64
          in_cav_lidar_range: *cav_lidar_m3
          out_cav_lidar_range: *cav_lidar_m3
          in_feature_shape: [256, 256]
          out_feature_shape: [256, 256]
          submodule_args:
            num_of_blocks: 3
            dim: 64

      fusion_method: pyramid 

      fusion_backbone: 
        resnext: true
        layer_nums: [3, 5, 8]
        layer_strides: [1, 2, 2]
        num_filters: [64, 128, 256]
        upsample_strides: [1, 2, 4]
        num_upsample_filter: [128, 128, 128]
        anchor_number: *anchor_num_m3

      shrink_header: 
        kernal_size: [ 3 ]
        stride: [ 1 ]
        padding: [ 1 ]
        dim: [ 256 ]
        input_dim: 384 # 128 * 3

      in_head: 256
      anchor_number: *anchor_num_m3
      dir_args: *dir_args_m3

loss_adapter:
  core_method: adapter_loss
  args:
    alpha_P2M: 9.0
    alpha_M2P2M: 1.0
    alpha_M2P: 10.0

loss:
  m0:
    core_method: point_pillar_pyramid_loss
    args:
      pos_cls_weight: 2.0
      cls:
        type: 'SigmoidFocalLoss'
        alpha: 0.25
        gamma: 2.0
        weight: 1.0
      reg:
        type: 'WeightedSmoothL1Loss'
        sigma: 3.0
        codewise: true
        weight: 2.0
      dir:
        type: 'WeightedSoftmaxClassificationLoss'
        weight: 0.2
        args: *dir_args_m0
      depth:
        weight: 1.0
      pyramid:
        relative_downsample: [1, 2, 4]
        weight: [0.4, 0.2, 0.1]
  m3:
    core_method: point_pillar_pyramid_loss
    args:
      pos_cls_weight: 2.0
      cls:
        type: 'SigmoidFocalLoss'
        alpha: 0.25
        gamma: 2.0
        weight: 1.0
      reg:
        type: 'WeightedSmoothL1Loss'
        sigma: 3.0
        codewise: true
        weight: 2.0
      dir:
        type: 'WeightedSoftmaxClassificationLoss'
        weight: 0.2
        args: *dir_args_m3
      depth:
        weight: 1.0
      pyramid:
        relative_downsample: [1, 2, 4]
        weight: [0.4, 0.2, 0.1]


optimizer:
  core_method: Adam
  lr: 0.01
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [1, 3, 4]



